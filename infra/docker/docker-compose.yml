name: agenda_gober

services:
  postgres:
    image: postgres:16.4
    container_name: agenda_gober_db
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
      # Los clientes que se conectan por red dentro del contenedor (nuestros
      # scripts vía `docker compose exec`) exigen TLS por defecto, igual que
      # cualquier cliente externo — ver infra/docker/initdb/00-enable-ssl.sh
      PGSSLMODE: require
    ports:
      # Bindeado solo a localhost: ni en tu propia máquina queda expuesto en la red.
      - "127.0.0.1:${POSTGRES_PORT:-5432}:5432"
    volumes:
      - agenda_gober_pgdata:/var/lib/postgresql/data
      - ./initdb:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  agenda_gober_pgdata:
