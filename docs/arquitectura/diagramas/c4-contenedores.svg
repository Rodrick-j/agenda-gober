<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" contentStyleType="text/css" height="883px" preserveAspectRatio="none" style="width:1064px;height:883px;background:#FFFFFF;" version="1.1" viewBox="0 0 1064 883" width="1064px" zoomAndPan="magnify"><title>AGENDA.GOBER &#8212; Diagrama de contenedores (C4 nivel 2)</title><defs/><g><text fill="#000000" font-family="sans-serif" font-size="14" font-weight="bold" lengthAdjust="spacing" textLength="396.751" x="326.7998" y="24.5332">AGENDA.GOBER &#8212; Diagrama de contenedores (C4 nivel 2)</text><!--entity Navegador--><g id="elem_Navegador"><rect fill="#F1F1F1" height="37.6094" rx="5" ry="5" style="stroke:#2C3E50;stroke-width:0.5;" width="160.8682" x="461.5" y="217.1094"/><text fill="#000000" font-family="sans-serif" font-size="14" lengthAdjust="spacing" textLength="140.8682" x="471.5" y="241.6426">Navegador del usuario</text></g><!--entity Usuario--><g id="elem_Usuario"><ellipse cx="542.2134" cy="52.6094" fill="#F1F1F1" rx="8" ry="8" style="stroke:#181818;stroke-width:0.5;"/><path d="M542.2134,60.6094 L542.2134,87.6094 M529.2134,68.6094 L555.2134,68.6094 M542.2134,87.6094 L529.2134,102.6094 M542.2134,87.6094 L555.2134,102.6094 " fill="none" style="stroke:#181818;stroke-width:0.5;"/><text fill="#000000" font-family="sans-serif" font-size="14" lengthAdjust="spacing" textLength="128.4268" x="478" y="118.6426">Persona autenticada</text><text fill="#000000" font-family="sans-serif" font-size="14" lengthAdjust="spacing" textLength="85.5859" x="478" y="136.252">(cualquier rol)</text></g><!--entity Web--><g id="elem_Web"><rect fill="#F1F1F1" height="143.2656" rx="5" ry="5" style="stroke:#2C3E50;stroke-width:0.5;" width="264.3506" x="794" y="358.1094"/><text fill="#000000" font-family="sans-serif" font-size="14" lengthAdjust="spacing" textLength="96.4893" x="804" y="382.6426">Aplicaci&#243;n Web</text><text fill="#000000" font-family="sans-serif" font-size="14" lengthAdjust="spacing" textLength="222.9609" x="804" y="400.252">[Contenedor: Next.js 16 + React 19]</text><text fill="#000000" font-family="sans-serif" font-size="14" lengthAdjust="spacing" textLength="3.8896" x="804" y="417.8613">&#160;</text><text fill="#000000" font-family="sans-serif" font-size="14" lengthAdjust="spacing" textLength="230.7266" x="804" y="435.4707">Sirve el HTML/JS de las 16+ p&#225;ginas</text><text fill="#000000" font-family="sans-serif" font-size="14" lengthAdjust="spacing" textLength="244.3506" x="804" y="453.0801">del panel. NO act&#250;a como backend-for-</text><text fill="#000000" font-family="sans-serif" font-size="14" lengthAdjust="spacing" textLength="230.3643" x="804" y="470.6895">frontend: el navegador llama a la API</text><text fill="#000000" font-family="sans-serif" font-size="14" lengthAdjust="spacing" textLength="207.751" x="804" y="488.2988">directo, cruzando origen (CORS).</text></g><!--entity Api--><g id="elem_Api"><rect fill="#F1F1F1" height="160.875" rx="5" ry="5" style="stroke:#2C3E50;stroke-width:0.5;" width="273.6885" x="46" y="349.1094"/><text fill="#000000" font-family="sans-serif" font-size="14" lengthAdjust="spacing" textLength="22.5654" x="56" y="373.6426">API</text><text fill="#000000" font-family="sans-serif" font-size="14" lengthAdjust="spacing" textLength="212.4473" x="56" y="391.252">[Contenedor: NestJS 10 / Node.js]</text><text fill="#000000" font-family="sans-serif" font-size="14" lengthAdjust="spacing" textLength="3.8896" x="56" y="408.8613">&#160;</text><text fill="#000000" font-family="sans-serif" font-size="14" lengthAdjust="spacing" textLength="251.7129" x="56" y="426.4707">REST + WebSocket en el mismo puerto.</text><text fill="#000000" font-family="sans-serif" font-size="14" lengthAdjust="spacing" textLength="227.2539" x="56" y="444.0801">Toda la autorizaci&#243;n de negocio vive</text><text fill="#000000" font-family="sans-serif" font-size="14" lengthAdjust="spacing" textLength="253.6885" x="56" y="461.6895">en la base (RLS); esta capa valida forma</text><text fill="#000000" font-family="sans-serif" font-size="14" lengthAdjust="spacing" textLength="242.04" x="56" y="479.2988">de entrada, arma el contexto de sesi&#243;n</text><text fill="#000000" font-family="sans-serif" font-size="14" lengthAdjust="spacing" textLength="240.4268" x="56" y="496.9082">y traduce errores de Postgres a HTTP.</text></g><!--entity Db--><g id="elem_Db"><path d="M42.5,631.1094 C42.5,621.1094 182.8374,621.1094 182.8374,621.1094 C182.8374,621.1094 323.1748,621.1094 323.1748,631.1094 L323.1748,745.7656 C323.1748,755.7656 182.8374,755.7656 182.8374,755.7656 C182.8374,755.7656 42.5,755.7656 42.5,745.7656 L42.5,631.1094 " fill="#EAF2F8" style="stroke:#181818;stroke-width:0.5;"/><path d="M42.5,631.1094 C42.5,641.1094 182.8374,641.1094 182.8374,641.1094 C182.8374,641.1094 323.1748,641.1094 323.1748,631.1094 " fill="none" style="stroke:#181818;stroke-width:0.5;"/><text fill="#000000" font-family="sans-serif" font-size="14" lengthAdjust="spacing" textLength="89.5098" x="52.5" y="659.6426">Base de datos</text><text fill="#000000" font-family="sans-serif" font-size="14" lengthAdjust="spacing" textLength="196.123" x="52.5" y="677.252">[Contenedor: PostgreSQL 16.4]</text><text fill="#000000" font-family="sans-serif" font-size="14" lengthAdjust="spacing" textLength="3.8896" x="52.5" y="694.8613">&#160;</text><text fill="#000000" font-family="sans-serif" font-size="14" lengthAdjust="spacing" textLength="228.792" x="52.5" y="712.4707">26 migraciones versionadas a mano.</text><text fill="#000000" font-family="sans-serif" font-size="14" lengthAdjust="spacing" textLength="260.6748" x="52.5" y="730.0801">Row Level Security FORCE en cada tabla</text><text fill="#000000" font-family="sans-serif" font-size="14" lengthAdjust="spacing" textLength="247.4883" x="52.5" y="747.6895">de negocio. app_user sin BYPASSRLS.</text></g><!--entity Sentry--><g id="elem_Sentry"><path d="M455.6277,665.2496 C459.9434,657.7259 464.28,657.2056 469.4366,664.4641 C473.0377,656.0867 477.6588,656.1184 484.0645,661.4774 C488.1689,655.3628 492.5318,654.8929 496.7033,661.4103 C498.9954,654.7165 504.389,652.3669 510.0278,657.7037 C513.4701,649.2262 521.5225,648.56 526.1506,656.5421 C529.6049,648.8746 534.1857,647.499 539.9854,654.2993 C542.8833,648.9251 548.2036,647.2856 552.2492,653.034 C557.6098,647.7057 562.8845,648.6523 566.4871,655.1505 C572.0647,648.9298 578.1164,650.3109 580.8416,658.0776 C584.9672,650.4991 590.3535,651.5566 594.9577,657.581 C600.7385,651.9203 608.6532,652.1844 610.808,661.4352 C614.4378,655.3126 620.6623,655.0357 623.6684,662.0461 C628.5871,655.3194 635.3852,657.9125 637.8511,664.6329 C643.0773,658.2042 648.8505,659.3232 652.7522,666.1247 C669.4135,669.7241 669.4446,679.2896 661.3323,691.3241 C668.8222,704.0979 666.9748,713.4682 650.4745,715.4415 C647.5039,720.8289 643.1586,722.3456 638.7654,716.9922 C635.3692,724.0346 628.2085,723.8164 624.2777,717.5752 C620.0568,723.7762 614.1121,724.3745 609.9596,717.5002 C606.1531,725.8795 600.2133,724.688 595.1757,718.7735 C591.6051,725.8477 586.983,726.8008 580.7257,722.0592 C577.0017,727.4835 573.0144,729.6968 568.1637,723.2516 C563.8655,731.227 558.8086,731.6566 553.609,724.096 C548.186,732.1808 541.3692,731.2327 537.9356,722.2673 C533.8641,727.7634 528.4445,728.8765 524.5468,722.0782 C520.0523,727.2 514.4543,725.9805 511.8784,719.9071 C507.0616,727.092 502.5695,725.6927 497.8391,719.8143 C492.4779,725.3809 486.8414,723.8248 484.0556,716.959 C477.8776,723.9705 473.1911,723.1089 469.2225,714.8175 C465.0747,721.5098 460.8103,721.7096 455.9943,715.5027 C448.6358,714.3681 446.3284,710.2982 449.3834,703.4513 C441.0037,702.1265 439.3616,697.3554 443.0707,690.2499 C438.5028,683.3747 443.2836,678.3694 450.0594,677.9283 C445.2392,670.8433 448.184,666.9484 455.6277,665.2496 " fill="#F1F1F1" style="stroke:#181818;stroke-width:0.5;"/><text fill="#000000" font-family="sans-serif" font-size="14" lengthAdjust="spacing" textLength="40.4619" x="460.5" y="685.6426">Sentry</text><text fill="#000000" font-family="sans-serif" font-size="14" lengthAdjust="spacing" textLength="182.8682" x="460.5" y="703.252">[Sistema externo &#8212; opcional]</text></g><g id="elem_GMN15"><path d="M355.5,375.6094 L355.5,425.6094 L320.33,429.6094 L355.5,433.6094 L355.5,483.7188 A0,0 0 0 0 355.5,483.7188 L758.0322,483.7188 A0,0 0 0 0 758.0322,483.7188 L758.0322,385.6094 L748.0322,375.6094 L355.5,375.6094 A0,0 0 0 0 355.5,375.6094 " fill="#FEFFDD" style="stroke:#181818;stroke-width:0.5;"/><path d="M748.0322,375.6094 L748.0322,385.6094 L758.0322,385.6094 L748.0322,375.6094 " fill="#FEFFDD" style="stroke:#181818;stroke-width:0.5;"/><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="206.667" x="361.5" y="394.1045">Dentro de la API conviven 3 relojes:</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="243.4834" x="361.5" y="410.4561">1) el ciclo request/response HTTP normal,</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="381.5322" x="361.5" y="426.8076">2) el gateway de WebSocket (misma auth, cookie del handshake),</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="327.501" x="361.5" y="443.1592">3) 3 tareas @Cron (barridos horarios/10-min) que llaman</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="343.9097" x="372.3354" y="459.5107">funciones SQL SECURITY DEFINER para avisos vencidos.</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="339.6313" x="361.5" y="475.8623">Ver diagramas/componentes-*.puml para el detalle interno.</text></g><g id="elem_GMN18"><path d="M6,817.1094 L6,876.1641 A0,0 0 0 0 6,876.1641 L360.144,876.1641 A0,0 0 0 0 360.144,876.1641 L360.144,827.1094 L350.144,817.1094 L187,817.1094 L183,756.2194 L179,817.1094 L6,817.1094 A0,0 0 0 0 6,817.1094 " fill="#FEFFDD" style="stroke:#181818;stroke-width:0.5;"/><path d="M350.144,817.1094 L350.144,827.1094 L360.144,827.1094 L350.144,817.1094 " fill="#FEFFDD" style="stroke:#181818;stroke-width:0.5;"/><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="333.144" x="12" y="835.6045">PgListenerService (dentro de Api) mantiene una conexi&#243;n</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="313.6504" x="12" y="851.9561">LISTEN de larga duraci&#243;n aparte del pool &#8212; no puede</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="304.9414" x="12" y="868.3076">compartir conexiones que el pool recicla por request.</text></g><!--link Usuario to Navegador--><g id="link_Usuario_Navegador"><path d="M542,139.2694 C542,165.7294 542,191.3494 542,210.8294 " fill="none" id="Usuario-to-Navegador" style="stroke:#34495E;stroke-width:1;"/><polygon fill="#34495E" points="542,216.8294,546,207.8294,542,211.8294,538,207.8294,542,216.8294" style="stroke:#34495E;stroke-width:1;"/><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="57.0908" x="543" y="183.6045">interact&#250;a</text></g><!--link Navegador to Web--><g id="link_Navegador_Web"><path d="M622.57,245.8594 C664.05,252.6294 714.48,264.4894 756,285.1094 C793.02,303.4894 824.3515,327.532 853.4515,354.002 " fill="none" id="Navegador-to-Web" style="stroke:#34495E;stroke-width:1;"/><polygon fill="#34495E" points="857.89,358.0394,853.9239,349.0244,854.1913,354.6749,848.5407,354.9424,857.89,358.0394" style="stroke:#34495E;stroke-width:1;"/><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="42.6118" x="899.3335" y="299.6045">HTTPS</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="223.2788" x="809" y="315.9561">carga inicial de p&#225;ginas (SSR/est&#225;tico)</text></g><!--link Navegador to Api--><g id="link_Navegador_Api"><path d="M461.27,242.2494 C360.27,249.5194 198.25,264.2794 180,285.1094 C164.81,302.4494 160.6488,319.9991 161.9588,342.9991 " fill="none" id="Navegador-to-Api" style="stroke:#34495E;stroke-width:1;"/><polygon fill="#34495E" points="162.3,348.9894,165.7817,339.7765,162.0157,343.9975,157.7947,340.2314,162.3,348.9894" style="stroke:#34495E;stroke-width:1;"/><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="197.9644" x="240.6204" y="299.6045">HTTPS (fetch, credentials:include)</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="317.2051" x="181" y="315.9561">REST &#8212; cookies httpOnly access_token/refresh_token</text></g><!--link Navegador to Api--><g id="link_Navegador_Api"><path d="M538.46,255.1794 C533.76,274.1594 523.53,303.3994 503,319.1094 C443.81,364.4194 408.59,325.1794 338,349.1094 C332.13,351.0994 331.7844,351.0852 325.8544,353.4152 " fill="none" id="Navegador-to-Api-1" style="stroke:#34495E;stroke-width:1;"/><polygon fill="#34495E" points="320.27,355.6094,330.1094,356.041,324.9237,353.7809,327.1838,348.5951,320.27,355.6094" style="stroke:#34495E;stroke-width:1;"/><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="127.8608" x="574.1636" y="299.6045">WSS (socket.io-client)</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="218.188" x="529" y="315.9561">withCredentials: true &#8212; misma cookie</text></g><!--link Web to Sentry--><g id="link_Web_Sentry"><path d="M823.31,501.1794 C749.57,551.8494 658.6551,614.3214 602.8451,652.6714 " fill="none" id="Web-to-Sentry" style="stroke:#34495E;stroke-width:1;stroke-dasharray:7.0,7.0;"/><polygon fill="#34495E" points="597.9,656.0694,607.5829,654.2691,602.0209,653.2377,603.0522,647.6757,597.9,656.0694" style="stroke:#34495E;stroke-width:1;"/><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="100.439" x="788.0193" y="563.1045">errores de cliente</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="150.4775" x="763" y="579.4561">(@sentry/nextjs, opcional)</text></g><!--link Api to Db--><g id="link_Api_Db"><path d="M183,510.1694 C183,545.6894 183,581.0894 183,614.9594 " fill="none" id="Api-to-Db" style="stroke:#34495E;stroke-width:1;"/><polygon fill="#34495E" points="183,620.9594,187,611.9594,183,615.9594,179,611.9594,183,620.9594" style="stroke:#34495E;stroke-width:1;"/><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="190.0488" x="200.25" y="554.6045">SQL v&#237;a pg.Pool (node-postgres)</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="222.5488" x="184" y="570.9561">TLS (autofirmado en dev); set_config()</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="147.4116" x="221.5686" y="587.3076">por transacci&#243;n para RLS</text></g><!--link Api to Sentry--><g id="link_Api_Sentry"><path d="M320.4,502.0094 C326.32,504.7894 332.21,507.4994 338,510.1094 C371.5,525.1794 384.62,519.4694 415,540.1094 C462.12,572.1294 501.1574,618.3788 525.9374,651.2388 " fill="none" id="Api-to-Sentry" style="stroke:#34495E;stroke-width:1;stroke-dasharray:7.0,7.0;"/><polygon fill="#34495E" points="529.55,656.0294,527.3248,646.4352,526.5395,652.0373,520.9374,651.252,529.55,656.0294" style="stroke:#34495E;stroke-width:1;"/><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="96.1099" x="502.1838" y="563.1045">excepciones 5xx</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="150.4775" x="475" y="579.4561">(@sentry/nestjs, opcional)</text></g><!--SRC=[RLNRRjj647tdLmpS5wcnA5-3nWM2oBASk51bLLGQ15LWhCaLjVPgbzbTodA20ls8_a0-e4zzwwl_f5_ICoHjoqRr84Z