<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" contentStyleType="text/css" height="1080px" preserveAspectRatio="none" style="width:1512px;height:1080px;background:#FFFFFF;" version="1.1" viewBox="0 0 1512 1080" width="1512px" zoomAndPan="magnify"><title>Actividad &#8212; Solicitud y aprobaci&#243;n de cobertura de Comunicaci&#243;n (m&#243;dulo v1)</title><defs/><g><text fill="#000000" font-family="sans-serif" font-size="14" font-weight="bold" lengthAdjust="spacing" textLength="528.1787" x="490.5659" y="34.5332">Actividad &#8212; Solicitud y aprobaci&#243;n de cobertura de Comunicaci&#243;n (m&#243;dulo v1)</text><rect fill="none" height="22.6406" style="stroke:none;stroke-width:1;" width="1479.3105" x="15" y="51.0645"/><ellipse cx="120.0449" cy="88.7051" fill="#222222" rx="10" ry="10" style="stroke:#222222;stroke-width:1;"/><rect fill="#F4ECF7" height="50.1875" rx="12.5" ry="12.5" style="stroke:#6C3483;stroke-width:0.5;" width="156.7637" x="41.6631" y="118.7051"/><text fill="#000000" font-family="sans-serif" font-size="12" lengthAdjust="spacing" textLength="111.4102" x="51.6631" y="141.1621">Crea/tiene un evento</text><text fill="#000000" font-family="sans-serif" font-size="12" lengthAdjust="spacing" textLength="136.7637" x="51.6631" y="156.2559">en la Agenda institucional</text><path d="M239.0898,178.8926 L239.0898,212.5957 L219.0898,216.5957 L239.0898,220.5957 L239.0898,254.2988 A0,0 0 0 0 239.0898,254.2988 L546.2231,254.2988 A0,0 0 0 0 546.2231,254.2988 L546.2231,188.8926 L536.2231,178.8926 L239.0898,178.8926 A0,0 0 0 0 239.0898,178.8926 " fill="#FEFFDD" style="stroke:#181818;stroke-width:0.5;"/><path d="M536.2231,178.8926 L536.2231,188.8926 L546.2231,188.8926 L536.2231,178.8926 " fill="#FEFFDD" style="stroke:#181818;stroke-width:0.5;"/><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="252.5796" x="245.0898" y="197.3877">Solo un director+ de la secretar&#237;a due&#241;a del</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="274.5869" x="245.0898" y="213.7393">evento, o directamente UNICOM, puede pedirla</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="255.7725" x="245.0898" y="230.0908">(pol&#237;tica cobertura_insert). Un mismo evento</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="286.1333" x="245.0898" y="246.4424">solo admite una solicitud (evento_id es UNIQUE).</text><rect fill="#F4ECF7" height="50.1875" rx="12.5" ry="12.5" style="stroke:#6C3483;stroke-width:0.5;" width="198.0898" x="21" y="191.502"/><text fill="#000000" font-family="sans-serif" font-size="12" lengthAdjust="spacing" textLength="171.4336" x="31" y="213.959">Pide cobertura de comunicaci&#243;n</text><text fill="#000000" font-family="sans-serif" font-size="12" lengthAdjust="spacing" textLength="178.0898" x="31" y="229.0527">(POST /comunicacion {eventoId})</text><line style="stroke:#000000;stroke-width:1.5;" x1="15" x2="15" y1="51.0645" y2="1068.3457"/><rect fill="#F4ECF7" height="50.1875" rx="12.5" ry="12.5" style="stroke:#6C3483;stroke-width:0.5;" width="120.7051" x="579.2485" y="274.2988"/><text fill="#000000" font-family="sans-serif" font-size="12" lengthAdjust="spacing" textLength="76.7109" x="589.2485" y="296.7559">Notifica a todo</text><text fill="#000000" font-family="sans-serif" font-size="12" lengthAdjust="spacing" textLength="100.7051" x="589.2485" y="311.8496">el equipo UNICOM</text><rect fill="#F4ECF7" height="65.2813" rx="12.5" ry="12.5" style="stroke:#6C3483;stroke-width:0.5;" width="164.7559" x="557.2231" y="600.3301"/><text fill="#000000" font-family="sans-serif" font-size="12" lengthAdjust="spacing" textLength="144.7559" x="567.2231" y="622.7871">Notifica a Jefe de Gabinete</text><text fill="#000000" font-family="sans-serif" font-size="12" lengthAdjust="spacing" textLength="72.6914" x="567.2231" y="637.8809">(para el visto)</text><text fill="#000000" font-family="sans-serif" font-size="12" lengthAdjust="spacing" textLength="101.3906" x="567.2231" y="652.9746">y a quien la solicit&#243;</text><rect fill="#F4ECF7" height="65.2813" rx="12.5" ry="12.5" style="stroke:#6C3483;stroke-width:0.5;" width="144.7227" x="567.2397" y="860.6895"/><text fill="#000000" font-family="sans-serif" font-size="12" lengthAdjust="spacing" textLength="124.7227" x="577.2397" y="883.1465">Notifica al comunicador</text><text fill="#000000" font-family="sans-serif" font-size="12" lengthAdjust="spacing" textLength="75.3691" x="577.2397" y="898.2402">y al solicitante</text><text fill="#000000" font-family="sans-serif" font-size="12" lengthAdjust="spacing" textLength="110.748" x="577.2397" y="913.334">que el visto fue dado</text><line style="stroke:#000000;stroke-width:1.5;" x1="551.2231" x2="551.2231" y1="51.0645" y2="1068.3457"/><rect fill="#F4ECF7" height="95.4688" rx="12.5" ry="12.5" style="stroke:#6C3483;stroke-width:0.5;" width="180.1133" x="732.8052" y="344.4863"/><text fill="#000000" font-family="sans-serif" font-size="12" lengthAdjust="spacing" textLength="93.3691" x="742.8052" y="366.9434">Toma la solicitud,</text><text fill="#000000" font-family="sans-serif" font-size="12" lengthAdjust="spacing" textLength="110.7305" x="742.8052" y="382.0371">asigna comunicador,</text><text fill="#000000" font-family="sans-serif" font-size="12" lengthAdjust="spacing" textLength="118.0723" x="742.8052" y="397.1309">define tipo(s) de pieza</text><text fill="#000000" font-family="sans-serif" font-size="12" lengthAdjust="spacing" textLength="146.0566" x="742.8052" y="412.2246">(nota, redes, transmisi&#243;n...)</text><text fill="#000000" font-family="sans-serif" font-size="12" lengthAdjust="spacing" textLength="160.1133" x="742.8052" y="427.3184">y el enfoque/l&#237;nea de mensaje</text><rect fill="#F4ECF7" height="50.1875" rx="12.5" ry="12.5" style="stroke:#6C3483;stroke-width:0.5;" width="181.7656" x="731.979" y="459.9551"/><text fill="#000000" font-family="sans-serif" font-size="12" lengthAdjust="spacing" textLength="92.0625" x="741.979" y="482.4121">Avanza el estado</text><text fill="#000000" font-family="sans-serif" font-size="12" lengthAdjust="spacing" textLength="161.7656" x="741.979" y="497.5059">(planificada -&gt; en_producci&#243;n)</text><rect fill="#F4ECF7" height="50.1875" rx="12.5" ry="12.5" style="stroke:#6C3483;stroke-width:0.5;" width="120.043" x="762.8403" y="530.1426"/><text fill="#000000" font-family="sans-serif" font-size="12" lengthAdjust="spacing" textLength="100.043" x="772.8403" y="552.5996">Marca la cobertura</text><text fill="#000000" font-family="sans-serif" font-size="12" lengthAdjust="spacing" textLength="58.5996" x="772.8403" y="567.6934">como 'lista'</text><rect fill="#F4ECF7" height="80.375" rx="12.5" ry="12.5" style="stroke:#6C3483;stroke-width:0.5;" width="159.418" x="743.1528" y="945.9707"/><text fill="#000000" font-family="sans-serif" font-size="12" lengthAdjust="spacing" textLength="100.043" x="753.1528" y="968.4277">Marca la cobertura</text><text fill="#000000" font-family="sans-serif" font-size="12" lengthAdjust="spacing" textLength="88.6348" x="753.1528" y="983.5215">como 'publicada'</text><text fill="#000000" font-family="sans-serif" font-size="12" lengthAdjust="spacing" textLength="134.0918" x="753.1528" y="998.6152">(opcionalmente enlazada</text><text fill="#000000" font-family="sans-serif" font-size="12" lengthAdjust="spacing" textLength="139.418" x="753.1528" y="1013.709">a la Publicaci&#243;n que sali&#243;)</text><ellipse cx="822.8618" cy="1057.3457" fill="none" rx="11" ry="11" style="stroke:#222222;stroke-width:1;"/><ellipse cx="822.8618" cy="1057.3457" fill="#222222" rx="6" ry="6" style="stroke:#222222;stroke-width:1;"/><line style="stroke:#000000;stroke-width:1.5;" x1="725.979" x2="725.979" y1="51.0645" y2="1068.3457"/><polygon fill="#F4ECF7" points="1163.9272,685.6113,1274.6147,685.6113,1286.6147,699.4473,1274.6147,713.2832,1163.9272,713.2832,1151.9272,699.4473,1163.9272,685.6113" style="stroke:#6C3483;stroke-width:0.5;"/><text fill="#000000" font-family="sans-serif" font-size="11" lengthAdjust="spacing" textLength="58.0723" x="1163.9272" y="697.0303">&#191;Da el visto</text><text fill="#000000" font-family="sans-serif" font-size="11" lengthAdjust="spacing" textLength="110.6875" x="1163.9272" y="710.8662">a la l&#237;nea de mensaje?</text><text fill="#000000" font-family="sans-serif" font-size="11" lengthAdjust="spacing" textLength="8.5562" x="1143.3711" y="697.0303">s&#237;</text><text fill="#000000" font-family="sans-serif" font-size="11" lengthAdjust="spacing" textLength="51.3745" x="1286.6147" y="697.0303">todav&#237;a no</text><path d="M1087.7993,723.2832 L1087.7993,756.9863 L1067.7993,760.9863 L1087.7993,764.9863 L1087.7993,798.6895 A0,0 0 0 0 1087.7993,798.6895 L1366.73,798.6895 A0,0 0 0 0 1366.73,798.6895 L1366.73,733.2832 L1356.73,723.2832 L1087.7993,723.2832 A0,0 0 0 0 1087.7993,723.2832 " fill="#FEFFDD" style="stroke:#181818;stroke-width:0.5;"/><path d="M1356.73,723.2832 L1356.73,733.2832 L1366.73,733.2832 L1356.73,723.2832 " fill="#FEFFDD" style="stroke:#181818;stroke-width:0.5;"/><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="223.2915" x="1093.7993" y="741.7783">Un trigger (fn_cobertura_sello), no una</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="250.0024" x="1093.7993" y="758.1299">pol&#237;tica RLS, es quien impide que UNICOM</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="257.9307" x="1093.7993" y="774.4814">se d&#233; el visto a s&#237; mismo -- RLS ya lo dejar&#237;a</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="184.9771" x="1093.7993" y="790.833">hacer UPDATE de la fila entera.</text><rect fill="#F4ECF7" height="35.0938" rx="12.5" ry="12.5" style="stroke:#6C3483;stroke-width:0.5;" width="144.0547" x="923.7446" y="743.4395"/><text fill="#000000" font-family="sans-serif" font-size="12" lengthAdjust="spacing" textLength="124.0547" x="933.7446" y="765.8965">POST .../gabinete-visto</text><rect fill="#F4ECF7" height="65.2813" rx="12.5" ry="12.5" style="stroke:#6C3483;stroke-width:0.5;" width="112.0801" x="1376.73" y="723.2832"/><text fill="#000000" font-family="sans-serif" font-size="12" lengthAdjust="spacing" textLength="92.0801" x="1386.73" y="745.7402">Queda pendiente</text><text fill="#000000" font-family="sans-serif" font-size="12" lengthAdjust="spacing" textLength="83.9063" x="1386.73" y="760.834">en "Mi bandeja"</text><text fill="#000000" font-family="sans-serif" font-size="12" lengthAdjust="spacing" textLength="65.3848" x="1386.73" y="775.9277">de Gabinete</text><ellipse cx="1432.77" cy="829.6895" fill="none" rx="11" ry="11" style="stroke:#222222;stroke-width:1;"/><ellipse cx="1432.77" cy="829.6895" fill="#222222" rx="6" ry="6" style="stroke:#222222;stroke-width:1;"/><line style="stroke:#000000;stroke-width:1.5;" x1="917.7446" x2="917.7446" y1="51.0645" y2="1068.3457"/><line style="stroke:#000000;stroke-width:1.5;" x1="1492.8101" x2="1492.8101" y1="51.0645" y2="1068.3457"/><line style="stroke:#34495E;stroke-width:1;" x1="120.0449" x2="120.0449" y1="98.7051" y2="118.7051"/><polygon fill="#34495E" points="116.0449,108.7051,120.0449,118.7051,124.0449,108.7051,120.0449,112.7051" style="stroke:#34495E;stroke-width:1;"/><line style="stroke:#34495E;stroke-width:1;" x1="120.0449" x2="120.0449" y1="168.8926" y2="191.502"/><polygon fill="#34495E" points="116.0449,181.502,120.0449,191.502,124.0449,181.502,120.0449,185.502" style="stroke:#34495E;stroke-width:1;"/><line style="stroke:#34495E;stroke-width:1;" x1="822.8618" x2="822.8618" y1="439.9551" y2="459.9551"/><polygon fill="#34495E" points="818.8618,449.9551,822.8618,459.9551,826.8618,449.9551,822.8618,453.9551" style="stroke:#34495E;stroke-width:1;"/><line styl