<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" contentStyleType="text/css" height="637px" preserveAspectRatio="none" style="width:1141px;height:637px;background:#FFFFFF;" version="1.1" viewBox="0 0 1141 637" width="1141px" zoomAndPan="magnify"><title>Estados &#8212; tareas.estado y compromisos.estado</title><defs/><g><text fill="#000000" font-family="sans-serif" font-size="14" font-weight="bold" lengthAdjust="spacing" textLength="323.6611" x="398.4333" y="24.5332">Estados &#8212; tareas.estado y compromisos.estado</text><path d="M19.5,45.6094 L615.2877,45.6094 A12.5,12.5 0 0 1 627.7877,58.1094 L627.7877,73.2188 L7,73.2188 L7,58.1094 A12.5,12.5 0 0 1 19.5,45.6094 " fill="#FEF9E7" style="stroke:#FEF9E7;stroke-width:1;"/><rect fill="none" height="585.6094" rx="12.5" ry="12.5" style="stroke:#7D6608;stroke-width:0.5;" width="620.7877" x="7" y="45.6094"/><line style="stroke:#7D6608;stroke-width:0.5;" x1="7" x2="627.7877" y1="73.2188" y2="73.2188"/><text fill="#000000" font-family="sans-serif" font-size="14" lengthAdjust="spacing" textLength="36.5723" x="299.1077" y="65.1426">Tarea</text><ellipse cx="176.36" cy="94.2188" fill="#222222" rx="10" ry="10" style="stroke:#222222;stroke-width:1;"/><g id="TareaGroup.pendiente"><rect fill="#FEF9E7" height="50" rx="12.5" ry="12.5" style="stroke:#7D6608;stroke-width:0.5;" width="81.5029" x="135.36" y="158.2188"/><line style="stroke:#7D6608;stroke-width:0.5;" x1="135.36" x2="216.8629" y1="185.8281" y2="185.8281"/><text fill="#000000" font-family="sans-serif" font-size="14" lengthAdjust="spacing" textLength="61.5029" x="145.36" y="177.752">pendiente</text></g><g id="TareaGroup.en_progreso"><rect fill="#FEF9E7" height="50" rx="12.5" ry="12.5" style="stroke:#7D6608;stroke-width:0.5;" width="98.6133" x="126.86" y="356.2188"/><line style="stroke:#7D6608;stroke-width:0.5;" x1="126.86" x2="225.4733" y1="383.8281" y2="383.8281"/><text fill="#000000" font-family="sans-serif" font-size="14" lengthAdjust="spacing" textLength="78.6133" x="136.86" y="375.752">en_progreso</text></g><g id="TareaGroup.completada"><rect fill="#FEF9E7" height="50" rx="12.5" ry="12.5" style="stroke:#7D6608;stroke-width:0.5;" width="92.3789" x="58.36" y="571.2188"/><line style="stroke:#7D6608;stroke-width:0.5;" x1="58.36" x2="150.7389" y1="598.8281" y2="598.8281"/><text fill="#000000" font-family="sans-serif" font-size="14" lengthAdjust="spacing" textLength="72.3789" x="68.36" y="590.752">completada</text></g><g id="TareaGroup.cancelada"><rect fill="#FEF9E7" height="50" rx="12.5" ry="12.5" style="stroke:#7D6608;stroke-width:0.5;" width="83.8271" x="190.36" y="571.2188"/><line style="stroke:#7D6608;stroke-width:0.5;" x1="190.36" x2="274.1871" y1="598.8281" y2="598.8281"/><text fill="#000000" font-family="sans-serif" font-size="14" lengthAdjust="spacing" textLength="63.8271" x="200.36" y="590.752">cancelada</text></g><g id="elem_GMN2"><path d="M282.36,245.2188 L282.36,516.8438 L618.7877,516.8438 L618.7877,255.2188 L608.7877,245.2188 L282.36,245.2188 " fill="#FEFFDD" style="stroke:#181818;stroke-width:0.5;"/><path d="M608.7877,245.2188 L608.7877,255.2188 L618.7877,255.2188 L608.7877,245.2188 " fill="#FEFFDD" style="stroke:#181818;stroke-width:1;"/><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="297.0132" x="288.36" y="263.7139">NO hay trigger que imponga un orden entre estos 4</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="304.9351" x="288.36" y="280.0654">valores (a diferencia de publicaciones/instrucciones):</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="291.2305" x="288.36" y="296.417">cualquier transici&#243;n entre ellos es v&#225;lida en cuanto</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="310.5591" x="288.36" y="312.7686">a "forma". Lo que S&#205; est&#225; restringido es QUI&#201;N puede</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="117.0635" x="288.36" y="329.1201">tocar cada columna:</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="315.4277" x="288.36" y="345.4717">- el asignado sin rango director+ SOLO puede cambiar</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="304.1035" x="295.5836" y="361.8232">"estado" (fn_validar_edicion_tarea bloquea cualquier</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="194.3335" x="295.5836" y="378.1748">otro campo en el mismo PATCH);</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="290.8496" x="288.36" y="394.5264">- director+/transversal de la secretar&#237;a due&#241;a edita</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="90.3208" x="295.5836" y="410.8779">la fila completa.</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="279.1953" x="288.36" y="427.2295">Al entrar a 'completada': completada_at = now().</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="219.5718" x="288.36" y="443.5811">Al SALIR de 'completada', o si cambia</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="293.3823" x="288.36" y="459.9326">fecha_vencimiento: se limpian completada_at y los</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="286.1523" x="288.36" y="476.2842">marcadores de vencimiento (venc_recordado_at /</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="277.4751" x="288.36" y="492.6357">venc_vencida_at) -- el barrido horario los vuelve</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="125.0234" x="288.36" y="508.9873">a evaluar desde cero.</text></g><!--link *start*TareaGroup to pendiente--><g id="link_*start*TareaGroup_pendiente"><path d="M176.36,104.5287 C176.36,117.1588 176.36,134.1588 176.36,151.8687 " fill="none" id="*start*TareaGroup-to-pendiente" style="stroke:#34495E;stroke-width:1;"/><polygon fill="#34495E" points="176.36,157.8687,180.36,148.8687,176.36,152.8687,172.36,148.8687,176.36,157.8687" style="stroke:#34495E;stroke-width:1;"/><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="78.749" x="177.36" y="136.7139">POST /tareas</text></g><!--link pendiente to en_progreso--><g id="link_pendiente_en_progreso"><path d="M176.36,208.2487 C176.36,245.8687 176.36,312.2488 176.36,349.9888 " fill="none" id="pendiente-to-en_progreso" style="stroke:#34495E;stroke-width:1;"/><polygon fill="#34495E" points="176.36,355.9888,180.36,346.9888,176.36,350.9888,172.36,346.9888,176.36,355.9888" style="stroke:#34495E;stroke-width:1;"/></g><!--link en_progreso to completada--><g id="link_en_progreso_completada"><path d="M168.24,406.2388 C154.41,447.1488 128.361,524.2046 114.481,565.2746 " fill="none" id="en_progreso-to-completada" style="stroke:#34495E;stroke-width:1;"/><polygon fill="#34495E" points="112.56,570.9588,119.231,563.7132,114.1608,566.2219,111.6521,561.1518,112.56,570.9588" style="stroke:#34495E;stroke-width:1;"/></g><!--link pendiente to completada--><g id="link_pendiente_completada"><path d="M135.21,189.7987 C109.47,195.2088 77.18,205.7588 55.36,226.2188 C48.68,232.4887 49.17,236.2387 47.36,245.2188 C23.43,363.7188 34.17,397.0488 47.36,517.2188 C49.15,533.5088 46.93,539.1688 55.36,553.2188 C59.28,559.7488 60.2119,561.6654 65.8719,566.9954 " fill="none" id="pendiente-to-completada" style="stroke:#34495E;stroke-width:1;"/><polygon fill="#34495E" points="70.24,571.1088,66.4302,562.0266,66.5999,567.6809,60.9456,567.8507,70.24,571.1088" style="stroke:#34495E;stroke-width:1;"/></g><!--link completada to en_progreso--><g id="link_completada_en_progreso"><path d="M125.5,571.0188 C129.58,565.4488 133.47,559.3588 136.36,553.2188 C159.5,504.1287 169.0792,446.5853 173.2092,412.4553 " fill="none" id="completada-to-en_progreso" style="stroke:#34495E;stroke-width:1;"/><polygon fill="#34495E" points="173.93,406.4988,168.8778,414.953,173.3293,411.4625,176.8198,415.9141,173.93,406.4988" style="stroke:#34495E;stroke-width:1;"/><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="37.5654" x="145.36" y="549.7139">reabrir</text></g><!--link completada to pendiente--><g id="link_completada_pendiente"><path d="M94.11,571.2088 C70.35,511.6188 18,353.8788 78.36,245.2188 C90.53,223.3188 108.7296,210.7673 129.7396,201.0973 " fill="none" id="completada-to-pendiente" style="stroke:#34495E;stroke-width:1;"/><polygon fill="#34495E" points="135.19,198.5888,125.342,198.718,130.648,200.6792,128.6868,205.9852,135.19,198.5888" style="stroke:#34495E;stroke-width:1;"/><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="37.5654" x="79.36" y="386.7139">reabrir</text></g><!--link pendiente to cancelada--><g id="link_pendiente_cancelada"><path d="M207.46,208.2688 C218.09,218.3888 228.72,231.1088 234.36,245.2188 C280.13,359.7688 253.4083,506.8845 239.8283,565.3145 " fill="none" id="pendiente-to-cancelada" style="stroke:#34495E;stroke-width:1;"/><polygon fill="#34495E" points="238.47,571.1588,244.4036,563.2979,239.6019,566.2886,236.6113,561.4869,238.47,571.1588" style="stroke:#34495E;stroke-width:1;"/></g><!--link en_progreso to cancelada--><g id="link_en_progreso_cancelada"><path d="M182.68,406.2388 C193.43,447.1488 213.6654,524.0857 224.4554,565.1557 " fill="none" id="en_progreso-to-cancelada" style="stroke:#34495E;stroke-width:1;"/><polygon fill="#34495E" points="225.98,570.9588,227.5618,561.2377,224.7095,566.1229,219.8244,563.2705,225.98,570.9588" style="stroke:#34495E;stroke-width:1;"/></g><!--link pendiente to GMN2--><g id="link_pendiente_GMN2"><path d="M217.46,200.1088 C233.82,207.1688 252.5,216.1588 268.36,226.2188 C277.71,232.1488 287.09,238.5188 296.4,245.1787 " fill="none" id="pendiente-GMN2" style="stroke:#34495E;stroke-width:1;stroke-dasharray:7.0,7.0;"/></g><path d="M675.5,154.6094 L1115.0278,154.6094 A12.5,12.5 0 0 1 1127.5278,167.1094 L1127.5278,182.2188 L663,182.2188 L663,167.1094 A12.5,12.5 0 0 1 675.5,154.6094 " fill="#FEF9E7" style="stroke:#FEF9E7;stroke-width:1;"/><rect fill="none" height="368.4219" rx="12.5" ry="12.5" style="stroke:#7D6608;stroke-width:0.5;" width="464.5278" x="663" y="154.6094"/><line style="stroke:#7D6608;stroke-width:0.5;" x1="663" x2="1127.5278" y1="182.2188" y2="182.2188"/><text fill="#000000" font-family="sans-serif" font-size="14" lengthAdjust="spacing" textLength="79.3516" x="855.5881" y="174.1426">Compromiso</text><g id="CompromisoGroup.pendiente2"><rect fill="#FEF9E7" height="50" rx="12.5" ry="12.5" style="stroke:#7D6608;stroke-width:0.5;" width="81.5029" x="705" y="267.2188"/><line style="stroke:#7D6608;stroke-width:0.5;" x1="705" x2="786.5029" y1="294.8281" y2="294.8281"/><text fill="#000000" font-family="sans-serif" font-size="14" lengthAdjust="spacing" textLength="61.5029" x="715" y="286.752">pendiente</text></g><ellipse cx="746" cy="203.2188" fill="#222222" rx="10" ry="10" style="stroke:#222222;stroke-width:1;"/><g id="CompromisoGroup.cumplido"><rect fill="#FEF9E7" height="50" rx="12.5" ry="12.5" style="stroke:#7D6608;stroke-width:0.5;" width="76.0273" x="675" y="416.7188"/><line style="stroke:#7D6608;stroke-width:0.5;" x1="675" x2="751.0273" y1="444.3281" y2="444.3281"/><text fill="#000000" font-family="sans-serif" font-size="14" lengthAdjust="spacing" textLength="56.0273" x="685" y="436.252">cumplido</text></g><g id="elem_GMN5"><path d="M769.5,371.2188 L769.5,512.0313 A0,0 0 0 0 769.5,512.0313 L1118.5278,512.0313 A0,0 0 0 0 1118.5278,512.0313 L1118.5278,381.2188 L1108.5278,371.2188 L854.62,371.2188 L778.25,317.2488 L846.62,371.2188 L769.5,371.2188 A0,0 0 0 0 769.5,371.2188 " fill="#FEFFDD" style="stroke:#181818;stroke-width:0.5;"/><path d="M1108.5278,371.2188 L1108.5278,381.2188 L1118.5278,381.2188 L1108.5278,371.2188 " fill="#FEFFDD" style="stroke:#181818;stroke-width:0.5;"/><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="314.355" x="775.5" y="389.7139">Solo 2 estados. El responsable del compromiso puede</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="309.3022" x="775.5" y="406.0654">marcarlo cumplido aunque no tenga rango de director</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="282.5786" x="775.5" y="422.417">ni pertenezca a la secretar&#237;a due&#241;a de la reuni&#243;n</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="328.0278" x="775.5" y="438.7686">(fn_validar_edicion_compromiso, mismo mecanismo que</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="305.6587" x="775.5" y="455.1201">en Tareas, limita al responsable a tocar solo estado).</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="293.6172" x="775.5" y="471.4717">Al entrar a 'cumplido': cumplido_at = now(); al salir,</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="273.8506" x="775.5" y="487.8232">o si cambia fecha_limite, se limpia junto con los</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="323.6924" x="775.5" y="504.1748">marcadores de vencimiento (mismo patr&#243;n que Tareas).</text></g><!--link *start*CompromisoGroup to pendiente2--><g id="link_*start*CompromisoGroup_pendiente2"><path d="M746,213.5288 C746,226.1588 746,243.1588 746,260.8688 " fill="none" id="*start*CompromisoGroup-to-pendiente2" style="stroke:#34495E;stroke-width:1;"/><polygon fill="#34495E" points="746,266.8688,750,257.8688,746,261.8688,742,257.8688,746,266.8688" style="stroke:#34495E;stroke-width:1;"/><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="186.3989" x="747" y="245.7139">POST /eventos/:id/compromisos</text></g><!--link pendiente2 to cumplido--><g id="link_pendiente2_cumplido"><path d="M733.51,317.6387 C731.03,323.2888 728.67,329.3688 727,335.2188 C719.23,362.3988 716.1785,388.7941 714.6285,410.4441 " fill="none" id="pendiente2-to-cumplido" style="stroke:#34495E;stroke-width:1;"/><polygon fill="#34495E" points="714.2,416.4288,718.8325,407.7374,714.5571,411.4415,710.8529,407.1661,714.2,416.4288" style="stroke:#34495E;stroke-width:1;"/></g><!--link cumplido to pendiente2--><g id="link_cumplido_pendiente2"><path d="M718.37,416.6988 C724.51,389.2788 733.1814,350.5343 739.3114,323.1043 " fill="none" id="cumplido-to-pendiente2" style="stroke:#34495E;stroke-width:1;"/><polygon fill="#34495E" points="740.62,317.2488,734.7534,325.1597,739.5295,322.1284,742.5608,326.9045,740.62,317.2488" style="stroke:#34495E;stroke-width:1;"/><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="37.5654" x="738" y="349.7139">reabrir</text></g><!--SRC=[ZLHDZXj55Dxx54zcaJ5uR6I6X3W2QHWc8T8e4_2mGiXwxdxs5EckSbvLEngYI6nPiEC2EG0Bn15y4qx2LzKztPtn2D6hhdh_NttV2oOKGkS-SEuy_VFh7nHOXVr4qXNTKERAhRhIU7TxEV2lZDsoSaahpbvjr5KsFtE5K_heQVfw7eW8Gcy7H5yV-9u_VNp-A5gSvgBDxQDl7Zxyz8l1krwEKrNtfZ5_TdBo-FFpmQ3EExoAtGw9FQM_PyY_JTL-_FWdEZx-YhPYSoCMldDwURcuecaz85mwKtGKkyIS6nNlOEkTaZMYK0YcvuF03qpTuMvIr4VTbHezTEitsJdTASCsawAkSj1TQuFHEaIiN0Yk9BVkii14zEAIhlc6WfhDHfHULqAct3gxOQeinNUmo1vK26yDHfoag1q3U_5qn9IRjQZOpE1NQ5kj2fDnPfmLFpNM1wso-ZIQfz2iuk9rPL0hA5jlChF_korH52Y1lBlz-y802nI7lmqkXJ8DrqvB7axemgLM5_lVOr_xzq09fOpT670K2RxxuVd-jnTeH_9wpk0oLk22f9ahgj9otSunYe8jPcCZkxsnXAus3cEfPC7f9xIulBYi4