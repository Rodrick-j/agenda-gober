<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" contentStyleType="text/css" height="1032px" preserveAspectRatio="none" style="width:1601px;height:1032px;background:#FFFFFF;" version="1.1" viewBox="0 0 1601 1032" width="1601px" zoomAndPan="magnify"><title>Estados &#8212; instrucciones.estado (Despacho)</title><defs/><g><text fill="#000000" font-family="sans-serif" font-size="14" font-weight="bold" lengthAdjust="spacing" textLength="297.1787" x="645.2756" y="24.5332">Estados &#8212; instrucciones.estado (Despacho)</text><ellipse cx="636.5" cy="54.6094" fill="#222222" rx="10" ry="10" style="stroke:#222222;stroke-width:1;"/><g id="emitida"><rect fill="#EBF5EE" height="50" rx="12.5" ry="12.5" style="stroke:#1E8449;stroke-width:0.5;" width="65.1309" x="604" y="212.1094"/><line style="stroke:#1E8449;stroke-width:0.5;" x1="604" x2="669.1309" y1="239.7188" y2="239.7188"/><text fill="#000000" font-family="sans-serif" font-size="14" lengthAdjust="spacing" textLength="45.1309" x="614" y="231.6426">emitida</text></g><g id="en_organizacion"><rect fill="#EBF5EE" height="50" rx="12.5" ry="12.5" style="stroke:#1E8449;stroke-width:0.5;" width="122.7441" x="575" y="426.6094"/><line style="stroke:#1E8449;stroke-width:0.5;" x1="575" x2="697.7441" y1="454.2188" y2="454.2188"/><text fill="#000000" font-family="sans-serif" font-size="14" lengthAdjust="spacing" textLength="102.7441" x="585" y="446.1426">en_organizacion</text></g><g id="en_ejecucion"><rect fill="#EBF5EE" height="50" rx="12.5" ry="12.5" style="stroke:#1E8449;stroke-width:0.5;" width="102.5098" x="585" y="624.6094"/><line style="stroke:#1E8449;stroke-width:0.5;" x1="585" x2="687.5098" y1="652.2188" y2="652.2188"/><text fill="#000000" font-family="sans-serif" font-size="14" lengthAdjust="spacing" textLength="82.5098" x="595" y="644.1426">en_ejecucion</text></g><g id="cumplida"><rect fill="#EBF5EE" height="50" rx="12.5" ry="12.5" style="stroke:#1E8449;stroke-width:0.5;" width="76.0273" x="598.5" y="822.6094"/><line style="stroke:#1E8449;stroke-width:0.5;" x1="598.5" x2="674.5273" y1="850.2188" y2="850.2188"/><text fill="#000000" font-family="sans-serif" font-size="14" lengthAdjust="spacing" textLength="56.0273" x="608.5" y="842.1426">cumplida</text></g><g id="observada"><rect fill="#EBF5EE" height="50" rx="12.5" ry="12.5" style="stroke:#1E8449;stroke-width:0.5;" width="85.3789" x="7" y="822.6094"/><line style="stroke:#1E8449;stroke-width:0.5;" x1="7" x2="92.3789" y1="850.2188" y2="850.2188"/><text fill="#000000" font-family="sans-serif" font-size="14" lengthAdjust="spacing" textLength="65.3789" x="17" y="842.1426">observada</text></g><g id="cancelada"><rect fill="#EBF5EE" height="50" rx="12.5" ry="12.5" style="stroke:#1E8449;stroke-width:0.5;" width="83.8271" x="1180.5" y="822.6094"/><line style="stroke:#1E8449;stroke-width:0.5;" x1="1180.5" x2="1264.3271" y1="850.2188" y2="850.2188"/><text fill="#000000" font-family="sans-serif" font-size="14" lengthAdjust="spacing" textLength="63.8271" x="1190.5" y="842.1426">cancelada</text></g><g id="elem_GMN2"><path d="M248,158.6094 L248,315.7734 A0,0 0 0 0 248,315.7734 L568.8696,315.7734 A0,0 0 0 0 568.8696,315.7734 L568.8696,241.1094 L603.93,237.1094 L568.8696,233.1094 L568.8696,168.6094 L558.8696,158.6094 L248,158.6094 A0,0 0 0 0 248,158.6094 " fill="#FEFFDD" style="stroke:#181818;stroke-width:0.5;"/><path d="M558.8696,158.6094 L558.8696,168.6094 L568.8696,168.6094 L558.8696,158.6094 " fill="#FEFFDD" style="stroke:#181818;stroke-width:0.5;"/><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="263.7197" x="254" y="177.1045">El DTO de la API (UpdateInstruccionDto) solo</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="257.0801" x="254" y="193.4561">acepta 'observada'/'cancelada' como valores</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="299.8696" x="254" y="209.8076">manuales de estado -- un enum M&#193;S CHICO que el</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="262.3423" x="254" y="226.1592">tipo completo de la base de datos a prop&#243;sito</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="244.2261" x="254" y="242.5107">(InstruccionEstadoManual). El resto de las</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="238.4561" x="254" y="258.8623">transiciones (las de la izquierda) las hace</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="269.5723" x="254" y="275.2139">fn_despacho_recalcular en cada cambio de un</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="239.916" x="254" y="291.5654">&#237;tem hijo o de la propia instrucci&#243;n, nunca</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="108.3735" x="254" y="307.917">un PATCH directo.</text></g><g id="elem_GMN5"><path d="M922,587.6094 L922,645.6094 L688.39,649.6094 L922,653.6094 L922,712.0703 A0,0 0 0 0 922,712.0703 L1215.4604,712.0703 A0,0 0 0 0 1215.4604,712.0703 L1215.4604,597.6094 L1205.4604,587.6094 L922,587.6094 A0,0 0 0 0 922,587.6094 " fill="#FEFFDD" style="stroke:#181818;stroke-width:0.5;"/><path d="M1205.4604,587.6094 L1205.4604,597.6094 L1215.4604,597.6094 L1205.4604,587.6094 " fill="#FEFFDD" style="stroke:#181818;stroke-width:0.5;"/><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="272.4604" x="928" y="606.1045">en_riesgo es un booleano APARTE del estado,</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="257.2832" x="928" y="622.4561">no un estado propio: se prende si alg&#250;n &#237;tem</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="247.1143" x="928" y="638.8076">hijo est&#225; vencido y sin cerrar, o si venci&#243; la</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="226.897" x="928" y="655.1592">propia fecha_limite de la instrucci&#243;n sin</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="263.7578" x="928" y="671.5107">estar cumplida/observada/cancelada. Dispara</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="262.3105" x="928" y="687.8623">una notificaci&#243;n al Gobernador la primera vez</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="166.937" x="928" y="704.2139">que se prende (no se repite).</text></g><g id="elem_GMN8"><path d="M487.5,933.6094 L487.5,1025.3672 A0,0 0 0 0 487.5,1025.3672 L785.1055,1025.3672 A0,0 0 0 0 785.1055,1025.3672 L785.1055,943.6094 L775.1055,933.6094 L640.5,933.6094 L636.5,872.7594 L632.5,933.6094 L487.5,933.6094 A0,0 0 0 0 487.5,933.6094 " fill="#FEFFDD" style="stroke:#181818;stroke-width:0.5;"/><path d="M775.1055,933.6094 L775.1055,943.6094 L785.1055,943.6094 L775.1055,933.6094 " fill="#FEFFDD" style="stroke:#181818;stroke-width:0.5;"/><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="276.6055" x="493.5" y="952.1045">observada/cancelada/cumplida son "terminales"</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="259.4478" x="493.5" y="968.4561">para fn_despacho_recalcular: una vez ah&#237;, el</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="254.3315" x="493.5" y="984.8076">rec&#225;lculo autom&#225;tico NO las vuelve a mover</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="236.2725" x="493.5" y="1001.1592">aunque cambien los &#237;tems -- solo /reabrir</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="252.2178" x="493.5" y="1017.5107">(Gobernador) puede sacarla de ese estado.</text></g><!--link *start* to emitida--><g id="link_*start*_emitida"><path d="M636.5,64.8094 C636.5,91.8194 636.5,165.5394 636.5,205.9894 " fill="none" id="*start*-to-emitida" style="stroke:#34495E;stroke-width:1;"/><polygon fill="#34495E" points="636.5,211.9894,640.5,202.9894,636.5,206.9894,632.5,202.9894,636.5,211.9894" style="stroke:#34495E;stroke-width:1;"/><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="104.7808" x="678.6772" y="109.1045">Gobernador emite</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="187.1353" x="637.5" y="125.4561">(POST /despacho/instrucciones)</text></g><!--link emitida to en_organizacion--><g id="link_emitida_en_organizacion"><path d="M636.5,262.4894 C636.5,303.4794 636.5,379.7194 636.5,420.5194 " fill="none" id="emitida-to-en_organizacion" style="stroke:#34495E;stroke-width:1;"/><polygon fill="#34495E" points="636.5,426.5194,640.5,417.5194,636.5,421.5194,632.5,417.5194,636.5,426.5194" style="stroke:#34495E;stroke-width:1;"/><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="140.7593" x="637.5" y="360.1045">Jefe de Gabinete "toma"</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="117.0381" x="649.3606" y="376.4561">(PATCH organizaId)</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="121.3862" x="647.1865" y="392.8076">[autom&#225;tico al tomar]</text></g><!--link en_organizacion to en_ejecucion--><g id="link_en_organizacion_en_ejecucion"><path d="M636.5,476.6394 C636.5,514.2594 636.5,580.6394 636.5,618.3794 " fill="none" id="en_organizacion-to-en_ejecucion" style="stroke:#34495E;stroke-width:1;"/><polygon fill="#34495E" points="636.5,624.3794,640.5,615.3794,636.5,619.3794,632.5,615.3794,636.5,624.3794" style="stroke:#34495E;stroke-width:1;"/><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="146.6943" x="640.7532" y="521.1045">fn_despacho_recalcular()</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="150.3062" x="638.9473" y="537.4561">[autom&#225;tico: hay &gt;=1 &#237;tem</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="153.2007" x="637.5" y="553.8076">y no todos est&#225;n cerrados]</text></g><!--link en_ejecucion to en_ejecucion--><g id="link_en_ejecucion_en_ejecucion"><path d="M688.01,627.9094 C707.2,627.1994 723,634.4294 723,649.6094 C723,664.7894 713.1959,672.2412 694.0059,671.5312 " fill="none" id="en_ejecucion-to-en_ejecucion" style="stroke:#34495E;stroke-width:1;"/><polygon fill="#34495E" points="688.01,671.3094,696.856,675.6394,693.0066,671.4942,697.1517,667.6449,688.01,671.3094" style="stroke:#34495E;stroke-width:1;"/><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="146.6943" x="740.2068" y="638.6045">fn_despacho_recalcular()</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="169.1079" x="729" y="654.9561">[recalcula avance_porcentaje</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="160.4307" x="733.3386" y="671.3076">en cada cambio de un &#237;tem]</text></g><!--link en_ejecucion to cumplida--><g id="link_en_ejecucion_cumplida"><path d="M591.89,674.8494 C547.91,702.0594 491.09,748.2094 519.5,792.6094 C536.74,819.5594 565.4127,831.78 592.4927,838.62 " fill="none" id="en_ejecucion-to-cumplida" style="stroke:#34495E;stroke-width:1;"/><polygon fill="#34495E" points="598.31,840.0894,590.5636,834.0071,593.4623,838.8649,588.6045,841.7635,598.31,8