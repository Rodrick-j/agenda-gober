<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" contentStyleType="text/css" height="724px" preserveAspectRatio="none" style="width:775px;height:724px;background:#FFFFFF;" version="1.1" viewBox="0 0 775 724" width="775px" zoomAndPan="magnify"><title>Estados &#8212; instruccion_items.estado_validacion</title><defs/><g><text fill="#000000" font-family="sans-serif" font-size="14" font-weight="bold" lengthAdjust="spacing" textLength="322.0957" x="219.7666" y="24.5332">Estados &#8212; instruccion_items.estado_validacion</text><ellipse cx="380" cy="54.6094" fill="#222222" rx="10" ry="10" style="stroke:#222222;stroke-width:1;"/><g id="en_curso"><rect fill="#EBF5EE" height="50" rx="12.5" ry="12.5" style="stroke:#1E8449;stroke-width:0.5;" width="77.5928" x="341" y="220.6094"/><line style="stroke:#1E8449;stroke-width:0.5;" x1="341" x2="418.5928" y1="248.2188" y2="248.2188"/><text fill="#000000" font-family="sans-serif" font-size="14" lengthAdjust="spacing" textLength="57.5928" x="351" y="240.1426">en_curso</text></g><g id="pendiente_validacion"><rect fill="#EBF5EE" height="50" rx="12.5" ry="12.5" style="stroke:#1E8449;stroke-width:0.5;" width="151.5508" x="304" y="459.6094"/><line style="stroke:#1E8449;stroke-width:0.5;" x1="304" x2="455.5508" y1="487.2188" y2="487.2188"/><text fill="#000000" font-family="sans-serif" font-size="14" lengthAdjust="spacing" textLength="131.5508" x="314" y="479.1426">pendiente_validacion</text></g><g id="validado"><rect fill="#EBF5EE" height="97.9844" rx="12.5" ry="12.5" style="stroke:#1E8449;stroke-width:0.5;" width="168.7637" x="101.5" y="620.6094"/><line style="stroke:#1E8449;stroke-width:0.5;" x1="101.5" x2="270.2637" y1="648.2188" y2="648.2188"/><text fill="#000000" font-family="sans-serif" font-size="14" lengthAdjust="spacing" textLength="52.1514" x="159.8062" y="640.1426">validado</text><text fill="#000000" font-family="sans-serif" font-size="12" lengthAdjust="spacing" textLength="144.0938" x="106.5" y="665.6758">Pesa 100% en el promedio</text><text fill="#000000" font-family="sans-serif" font-size="12" lengthAdjust="spacing" textLength="148.7578" x="106.5" y="680.7695">de avance de la instrucci&#243;n,</text><text fill="#000000" font-family="sans-serif" font-size="12" lengthAdjust="spacing" textLength="138.0645" x="106.5" y="695.8633">sin importar el estado real</text><text fill="#000000" font-family="sans-serif" font-size="12" lengthAdjust="spacing" textLength="148.7637" x="106.5" y="710.957">de la tarea/proyecto/evento.</text></g><g id="devuelto"><rect fill="#EBF5EE" height="50" rx="12.5" ry="12.5" style="stroke:#1E8449;stroke-width:0.5;" width="72.9307" x="468.5" y="644.6094"/><line style="stroke:#1E8449;stroke-width:0.5;" x1="468.5" x2="541.4307" y1="672.2188" y2="672.2188"/><text fill="#000000" font-family="sans-serif" font-size="14" lengthAdjust="spacing" textLength="52.9307" x="478.5" y="664.1426">devuelto</text></g><g id="elem_GMN2"><path d="M6,158.6094 L6,332.125 A0,0 0 0 0 6,332.125 L305.9097,332.125 A0,0 0 0 0 305.9097,332.125 L305.9097,249.6094 L340.72,245.6094 L305.9097,241.6094 L305.9097,168.6094 L295.9097,158.6094 L6,158.6094 A0,0 0 0 0 6,158.6094 " fill="#FEFFDD" style="stroke:#181818;stroke-width:0.5;"/><path d="M295.9097,158.6094 L295.9097,168.6094 L305.9097,168.6094 L295.9097,158.6094 " fill="#FEFFDD" style="stroke:#181818;stroke-width:0.5;"/><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="272.4097" x="12" y="177.1045">fn_validar_edicion_item (trigger) es quien limita</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="236.2725" x="12" y="193.4561">al Responsable a UN SOLO movimiento:</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="263.4468" x="12" y="209.8076">{en_curso, devuelto} -&gt; pendiente_validacion.</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="263.0469" x="12" y="226.1592">Cualquier otro cambio que intente (peso, tipo,</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="249.9263" x="12" y="242.5107">ref_id, secretaria_id, o saltarse a 'validado')</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="213.1353" x="12" y="258.8623">se rechaza con RAISE EXCEPTION.</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="278.9097" x="12" y="275.2139">Un rol transversal (Gabinete/Gobernador/admin)</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="233.3843" x="12" y="291.5654">edita la fila completa sin esta restricci&#243;n,</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="273.9077" x="12" y="307.917">pero la API solo expone endpoints para llegar a</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="262.228" x="12" y="324.2686">mande el &#237;tem de vuelta a 'en_curso' a mano.</text></g><!--link *start* to en_curso--><g id="link_*start*_en_curso"><path d="M380,64.7294 C380,92.7494 380,172.2594 380,214.4894 " fill="none" id="*start*-to-en_curso" style="stroke:#34495E;stroke-width:1;"/><polygon fill="#34495E" points="380,220.4894,384,211.4894,380,215.4894,376,211.4894,380,220.4894" style="stroke:#34495E;stroke-width:1;"/><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="84.5127" x="393.6541" y="109.1045">POST .../items</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="109.8208" x="381" y="125.4561">(al agregar el &#237;tem)</text></g><!--link en_curso to pendiente_validacion--><g id="link_en_curso_pendiente_validacion"><path d="M380,270.6394 C380,316.0594 380,408.0394 380,453.5194 " fill="none" id="en_curso-to-pendiente_validacion" style="stroke:#34495E;stroke-width:1;"/><polygon fill="#34495E" points="380,459.5194,384,450.5194,380,454.5194,376,450.5194,380,459.5194" style="stroke:#34495E;stroke-width:1;"/><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="165.5024" x="382.8123" y="377.1045">Responsable pide validaci&#243;n</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="168.3208" x="381.4031" y="393.4561">(POST .../solicitar-validacion)</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="169.127" x="381" y="409.8076">[exige &gt;=1 evidencia adjunta,</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="59.9854" x="435.5708" y="426.1592">si no: 403]</text></g><!--link pendiente_validacion to validado--><g id="link_pendiente_validacion_validado"><path d="M303.64,491.2194 C268.92,497.7894 230.28,511.4694 206,539.6094 C187.05,561.5694 182.1083,587.8197 181.8483,614.5797 " fill="none" id="pendiente_validacion-to-validado" style="stroke:#34495E;stroke-width:1;"/><polygon fill="#34495E" points="181.79,620.5794,185.8773,611.6187,181.8386,615.5796,177.8776,611.5409,181.79,620.5794" style="stroke:#34495E;stroke-width:1;"/><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="136.5952" x="214.9124" y="562.6045">Jefe de Gabinete valida</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="152.4199" x="207" y="578.9561">(POST .../items/:id/validar)</text></g><!--link pendiente_validacion to devuelto--><g id="link_pendiente_validacion_devuelto"><path d="M372.61,509.7994 C367.23,532.2394 363.07,565.8094 377,590.6094 C396.37,625.0994 432.2393,644.0299 462.7593,655.4299 " fill="none" id="pendiente_validacion-to-devuelto" style="stroke:#34495E;stroke-width:1;"/><polygon fill="#34495E" points="468.38,657.5294,461.3486,650.633,463.6961,655.7798,458.5493,658.1273,468.38,657.5294" style="stroke:#34495E;stroke-width:1;"/><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="154.667" x="404.7078" y="554.1045">Jefe de Gabinete devuelve</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="163.2617" x="400.4104" y="570.4561">(POST .../items/:id/devolver)</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="208.0825" x="378" y="586.8076">[motivo_devolucion OBLIGATORIO]</text></g><!--link devuelto to pendiente_validacion--><g id="link_devuelto_pendiente_validacion"><path d="M540.2,644.5994 C574.64,618.1394 618.23,574.6894 591,539.6094 C574.31,518.0994 515.5557,504.6506 462.1657,496.1706 " fill="none" id="devuelto-to-pendiente_validacion" style="stroke:#34495E;stroke-width:1;"/><polygon fill="#34495E" points="456.24,495.2294,464.5011,500.5916,461.1781,496.0137,465.756,492.6907,456.24,495.2294" style="stroke:#34495E;stroke-width:1;"/><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="119.2344" x="624.1973" y="554.1045">Responsable corrige</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="152.4771" x="607.5759" y="570.4561">y vuelve a pedir validaci&#243;n</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="167.6289" x="600" y="586.8076">(misma regla: &gt;=1 evidencia)</text></g><!--SRC=[ZLHjIXn14Fq_foW8OJNehg92iX1XbL4sY2j-GC2LfNQcTktOqptfxjbeHCWXSetyoX6yIKwIrxCVRaGXyw-xgbxLU_LwWWfQAFM1S-lfpu-Vf8mFhieoPSr01IbyK-heOC9QvHpl4t-ZJCcE2nfoTZDsjZBvljNMqPk3-blAG74Gka-8zfxdfdi7EsaQ8zRbucQtc-dxxUqFoSCIHiSv-sqMta9m9qsIotTNjBw-Is86MUMyfJQTzCxEgTbijkgv-sQ5DV7OoPWTYQR7NxXUJP95HImlnUHAJ90bVe0w5LzQuta8TKgL2ysZZxyDW1UTlDKgKu7T-bFvQjzSogqQ2-r-t2IPeDnaYedpBvK9lDOtNf6nRThUsBfAaXSdYADDZtbazab6GfZYa8VAI9YFipn9pRdLLdbh6dEhho