<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" contentStyleType="text/css" height="822px" preserveAspectRatio="none" style="width:864px;height:822px;background:#FFFFFF;" version="1.1" viewBox="0 0 864 822" width="864px" zoomAndPan="magnify"><title>Estados &#8212; publicaciones.estado</title><defs/><g><text fill="#000000" font-family="sans-serif" font-size="14" font-weight="bold" lengthAdjust="spacing" textLength="219.3857" x="315.5435" y="24.5332">Estados &#8212; publicaciones.estado</text><ellipse cx="445" cy="54.6094" fill="#222222" rx="10" ry="10" style="stroke:#222222;stroke-width:1;"/><g id="borrador"><rect fill="#FEF9E7" height="50" rx="12.5" ry="12.5" style="stroke:#7D6608;stroke-width:0.5;" width="72.917" x="408.5" y="188.1094"/><line style="stroke:#7D6608;stroke-width:0.5;" x1="408.5" x2="481.417" y1="215.7188" y2="215.7188"/><text fill="#000000" font-family="sans-serif" font-size="14" lengthAdjust="spacing" textLength="52.917" x="418.5" y="207.6426">borrador</text></g><g id="revision"><rect fill="#FEF9E7" height="50" rx="12.5" ry="12.5" style="stroke:#7D6608;stroke-width:0.5;" width="68.2412" x="7" y="415.6094"/><line style="stroke:#7D6608;stroke-width:0.5;" x1="7" x2="75.2412" y1="443.2188" y2="443.2188"/><text fill="#000000" font-family="sans-serif" font-size="14" lengthAdjust="spacing" textLength="48.2412" x="17" y="435.1426">revision</text></g><g id="aprobado"><rect fill="#FEF9E7" height="50" rx="12.5" ry="12.5" style="stroke:#7D6608;stroke-width:0.5;" width="79.165" x="361.5" y="585.1094"/><line style="stroke:#7D6608;stroke-width:0.5;" x1="361.5" x2="440.665" y1="612.7188" y2="612.7188"/><text fill="#000000" font-family="sans-serif" font-size="14" lengthAdjust="spacing" textLength="59.165" x="371.5" y="604.6426">aprobado</text></g><g id="publicado"><rect fill="#FEF9E7" height="82.8906" rx="12.5" ry="12.5" style="stroke:#7D6608;stroke-width:0.5;" width="226.1211" x="288" y="733.6094"/><line style="stroke:#7D6608;stroke-width:0.5;" x1="288" x2="514.1211" y1="761.2188" y2="761.2188"/><text fill="#000000" font-family="sans-serif" font-size="14" lengthAdjust="spacing" textLength="59.9375" x="371.0918" y="753.1426">publicado</text><text fill="#000000" font-family="sans-serif" font-size="12" lengthAdjust="spacing" textLength="178.7578" x="293" y="778.6758">Estado terminal en el uso normal.</text><text fill="#000000" font-family="sans-serif" font-size="12" lengthAdjust="spacing" textLength="144.75" x="293" y="793.7695">No hay transici&#243;n de vuelta</text><text fill="#000000" font-family="sans-serif" font-size="12" lengthAdjust="spacing" textLength="206.1211" x="293" y="808.8633">documentada para roles de secretar&#237;a.</text></g><g id="elem_GMN2"><path d="M64.5,142.6094 L64.5,283.4219 A0,0 0 0 0 64.5,283.4219 L373.8105,283.4219 A0,0 0 0 0 373.8105,283.4219 L373.8105,217.1094 L408.36,213.1094 L373.8105,209.1094 L373.8105,152.6094 L363.8105,142.6094 L64.5,142.6094 A0,0 0 0 0 64.5,142.6094 " fill="#FEFFDD" style="stroke:#181818;stroke-width:0.5;"/><path d="M363.8105,142.6094 L363.8105,152.6094 L373.8105,152.6094 L363.8105,142.6094 " fill="#FEFFDD" style="stroke:#181818;stroke-width:0.5;"/><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="239.9097" x="70.5" y="161.1045">fn_validar_transicion_publicacion (trigger,</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="288.3105" x="70.5" y="177.4561">005_permisos_finos.sql) es quien impone TODAS</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="252.1924" x="70.5" y="193.8076">estas flechas -- una transici&#243;n fuera de esta</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="250.0215" x="70.5" y="210.1592">lista, para un rol de secretar&#237;a, revienta con</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="155.3208" x="70.5" y="226.5107">RAISE EXCEPTION (403).</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="211.7197" x="70.5" y="242.8623">Los roles transversales (gobernador,</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="232.7114" x="70.5" y="259.2139">jefe_gabinete, admin) pueden moverla a</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="233.3652" x="70.5" y="275.5654">CUALQUIER estado sin esta restricci&#243;n.</text></g><g id="elem_GMN5"><path d="M110.5,394.6094 L110.5,436.6094 L75.1,440.6094 L110.5,444.6094 L110.5,486.3672 A0,0 0 0 0 110.5,486.3672 L377.916,486.3672 A0,0 0 0 0 377.916,486.3672 L377.916,404.6094 L367.916,394.6094 L110.5,394.6094 A0,0 0 0 0 110.5,394.6094 " fill="#FEFFDD" style="stroke:#181818;stroke-width:0.5;"/><path d="M367.916,394.6094 L367.916,404.6094 L377.916,404.6094 L367.916,394.6094 " fill="#FEFFDD" style="stroke:#181818;stroke-width:0.5;"/><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="222.9233" x="116.5" y="413.1045">Al entrar: enviado_revision_at = now(),</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="202.6934" x="116.5" y="429.4561">motivo_rechazo = NULL (021/025).</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="246.416" x="116.5" y="445.8076">Si pasan 48h sin salir de ac&#225;: recordatorio.</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="212.8306" x="116.5" y="462.1592">Si pasan 96h: escala + avisa al autor</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="218.9688" x="116.5" y="478.5107">(fn_publicaciones_sweep, cada hora).</text></g><g id="elem_GMN8"><path d="M476,580.6094 L476,606.1094 L440.53,610.1094 L476,614.1094 L476,639.6641 A0,0 0 0 0 476,639.6641 L765.855,639.6641 A0,0 0 0 0 765.855,639.6641 L765.855,590.6094 L755.855,580.6094 L476,580.6094 A0,0 0 0 0 476,580.6094 " fill="#FEFFDD" style="stroke:#181818;stroke-width:0.5;"/><path d="M755.855,580.6094 L755.855,590.6094 L765.855,590.6094 L755.855,580.6094 " fill="#FEFFDD" style="stroke:#181818;stroke-width:0.5;"/><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="268.855" x="482" y="599.1045">Al entrar: aprobado_por/aprobado_at sellados.</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="235.5806" x="482" y="615.4561">Si pasan 48h sin publicarse: recordatorio</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="228.3442" x="482" y="631.8076">al secretario (fn_publicaciones_sweep).</text></g><g id="elem_GMN11"><path d="M412.5,403.1094 L412.5,478.5156 A0,0 0 0 0 412.5,478.5156 L689.3169,478.5156 A0,0 0 0 0 689.3169,478.5156 L689.3169,413.1094 L679.3169,403.1094 L537.81,403.1094 L456.34,238.2394 L529.81,403.1094 L412.5,403.1094 A0,0 0 0 0 412.5,403.1094 " fill="#FEFFDD" style="stroke:#181818;stroke-width:0.5;"/><path d="M679.3169,403.1094 L679.3169,413.1094 L689.3169,413.1094 L679.3169,403.1094 " fill="#FEFFDD" style="stroke:#181818;stroke-width:0.5;"/><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="215.2871" x="418.5" y="421.6045">Al ENTRAR (por rechazo): se limpian</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="221.8823" x="418.5" y="437.9561">enviado_revision_at, aprobado_por/at,</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="255.8169" x="418.5" y="454.3076">publicado_por/at y los 3 marcadores de SLA</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="205.9307" x="418.5" y="470.6592">-- el siguiente ciclo arranca en cero.</text></g><!--link *start* to borrador--><g id="link_*start*_borrador"><path d="M445,64.9294 C445,88.8194 445,146.8094 445,182.0394 " fill="none" id="*start*-to-borrador" style="stroke:#34495E;stroke-width:1;"/><polygon fill="#34495E" points="445,188.0394,449,179.0394,445,183.0394,441,179.0394,445,188.0394" style="stroke:#34495E;stroke-width:1;"/><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="121.3926" x="446" y="109.1045">POST /publicaciones</text></g><!--link borrador to revision--><g id="link_borrador_revision"><path d="M432.52,238.2794 C423.21,253.7794 409.01,272.9394 391,283.6094 C318.97,326.3094 282.35,281.5394 205,313.6094 C147.95,337.2594 97.782,381.7761 68.212,411.2161 " fill="none" id="borrador-to-revision" style="stroke:#34495E;stroke-width:1;"/><polygon fill="#34495E" points="63.96,415.4494,73.1602,411.9341,67.5033,411.9216,67.5158,406.2648,63.96,415.4494" style="stroke:#34495E;stroke-width:1;"/><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="70.8145" x="215.3945" y="328.1045">cualquier rol</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="89.6035" x="206" y="344.4561">de la secretar&#237;a</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="81.6436" x="209.98" y="360.8076">(pide revisi&#243;n)</text></g><!--link revision to borrador--><g id="link_revision_borrador"><path d="M63.04,415.6094 C71.63,407.6794 82.03,399.6194 93,394.6094 C177.55,355.9694 216.31,405.0794 300,364.6094 C329.72,350.2394 329.16,335.3494 354,313.6094 C369.93,299.6694 376.19,298.7294 391,283.6094 C404.69,269.6394 414.6666,257.1159 424.7366,243.2359 " fill="none" id="revision-to-borrador" style="stroke:#34495E;stroke-width:1;"/><polygon fill="#34495E" points="428.26,238.3794,419.7372,243.3152,425.3238,242.4265,426.2125,248.0