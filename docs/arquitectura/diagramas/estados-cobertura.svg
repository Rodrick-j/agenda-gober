<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" contentStyleType="text/css" height="1214px" preserveAspectRatio="none" style="width:945px;height:1214px;background:#FFFFFF;" version="1.1" viewBox="0 0 945 1214" width="945px" zoomAndPan="magnify"><title>Estados &#8212; cobertura.estado (Comunicaci&#243;n)</title><defs/><g><text fill="#000000" font-family="sans-serif" font-size="14" font-weight="bold" lengthAdjust="spacing" textLength="300.2686" x="315.7196" y="24.5332">Estados &#8212; cobertura.estado (Comunicaci&#243;n)</text><g id="elem_NotaVisto"><path d="M660.45,44.6094 L660.45,169.0703 L938.7078,169.0703 L938.7078,54.6094 L928.7078,44.6094 L660.45,44.6094 " fill="#FEFFDD" style="stroke:#181818;stroke-width:0.5;"/><path d="M928.7078,44.6094 L928.7078,54.6094 L938.7078,54.6094 L928.7078,44.6094 " fill="#FEFFDD" style="stroke:#181818;stroke-width:1;"/><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="257.2578" x="666.45" y="63.1045">gabinete_visto_at es una COLUMNA aparte,</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="181.4033" x="666.45" y="79.4561">no un estado m&#225;s: se pone con</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="218.9561" x="666.45" y="95.8076">POST .../gabinete-visto, solo la puede</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="254.3506" x="666.45" y="112.1592">setear un rol transversal (fn_cobertura_sello</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="229.7534" x="666.45" y="128.5107">lo exige con RAISE EXCEPTION si no).</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="244.2769" x="666.45" y="144.8623">Puede estar presente en cualquiera de los</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="104.0635" x="666.45" y="161.2139">estados de arriba.</text></g><ellipse cx="615.45" cy="106.6094" fill="#222222" rx="10" ry="10" style="stroke:#222222;stroke-width:1;"/><g id="solicitada"><rect fill="#F4ECF7" height="50" rx="12.5" ry="12.5" style="stroke:#6C3483;stroke-width:0.5;" width="78.3652" x="576.45" y="414.1094"/><line style="stroke:#6C3483;stroke-width:0.5;" x1="576.45" x2="654.8152" y1="441.7188" y2="441.7188"/><text fill="#000000" font-family="sans-serif" font-size="14" lengthAdjust="spacing" textLength="58.3652" x="586.45" y="433.6426">solicitada</text></g><g id="planificada"><rect fill="#F4ECF7" height="50" rx="12.5" ry="12.5" style="stroke:#6C3483;stroke-width:0.5;" width="86.9375" x="479.95" y="709.6094"/><line style="stroke:#6C3483;stroke-width:0.5;" x1="479.95" x2="566.8875" y1="737.2188" y2="737.2188"/><text fill="#000000" font-family="sans-serif" font-size="14" lengthAdjust="spacing" textLength="66.9375" x="489.95" y="729.1426">planificada</text></g><g id="en_produccion"><rect fill="#F4ECF7" height="50" rx="12.5" ry="12.5" style="stroke:#6C3483;stroke-width:0.5;" width="111.8477" x="246.45" y="853.6094"/><line style="stroke:#6C3483;stroke-width:0.5;" x1="246.45" x2="358.2977" y1="881.2188" y2="881.2188"/><text fill="#000000" font-family="sans-serif" font-size="14" lengthAdjust="spacing" textLength="91.8477" x="256.45" y="873.1426">en_produccion</text></g><g id="lista"><rect fill="#F4ECF7" height="50" rx="12.5" ry="12.5" style="stroke:#6C3483;stroke-width:0.5;" width="50" x="95.45" y="1014.6094"/><line style="stroke:#6C3483;stroke-width:0.5;" x1="95.45" x2="145.45" y1="1042.2188" y2="1042.2188"/><text fill="#000000" font-family="sans-serif" font-size="14" lengthAdjust="spacing" textLength="24.8965" x="108.0018" y="1034.1426">lista</text></g><g id="publicada"><rect fill="#F4ECF7" height="50" rx="12.5" ry="12.5" style="stroke:#6C3483;stroke-width:0.5;" width="79.9375" x="80.45" y="1158.6094"/><line style="stroke:#6C3483;stroke-width:0.5;" x1="80.45" x2="160.3875" y1="1186.2188" y2="1186.2188"/><text fill="#000000" font-family="sans-serif" font-size="14" lengthAdjust="spacing" textLength="59.9375" x="90.45" y="1178.1426">publicada</text></g><g id="descartada"><rect fill="#F4ECF7" height="50" rx="12.5" ry="12.5" style="stroke:#6C3483;stroke-width:0.5;" width="89.2686" x="478.95" y="1014.6094"/><line style="stroke:#6C3483;stroke-width:0.5;" x1="478.95" x2="568.2186" y1="1042.2188" y2="1042.2188"/><text fill="#000000" font-family="sans-serif" font-size="14" lengthAdjust="spacing" textLength="69.2686" x="488.95" y="1034.1426">descartada</text></g><g id="elem_GMN2"><path d="M269.45,262.6094 L269.45,615.9922 A0,0 0 0 0 269.45,615.9922 L541.9188,615.9922 A0,0 0 0 0 541.9188,615.9922 L541.9188,443.1094 L576.23,439.1094 L541.9188,435.1094 L541.9188,272.6094 L531.9188,262.6094 L269.45,262.6094 A0,0 0 0 0 269.45,262.6094 " fill="#FEFFDD" style="stroke:#181818;stroke-width:0.5;"/><path d="M531.9188,262.6094 L531.9188,272.6094 L541.9188,272.6094 L531.9188,262.6094 " fill="#FEFFDD" style="stroke:#181818;stroke-width:0.5;"/><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="234.1143" x="275.45" y="281.1045">A DIFERENCIA de publicaciones.estado</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="195.8442" x="275.45" y="297.4561">(021_publicaciones_flujo.sql) y de</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="208.1143" x="275.45" y="313.8076">instruccion_items.estado_validacion</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="211.0278" x="275.45" y="330.1592">(016_despacho_validacion.sql), este</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="251.4688" x="275.45" y="346.5107">diagrama de estados NO est&#225; impuesto por</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="200.1987" x="275.45" y="362.8623">ning&#250;n trigger de base de datos: el</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="241.3569" x="275.45" y="379.2139">ActualizarCoberturaDto acepta cualquiera</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="169.0952" x="275.45" y="395.5654">de los 6 valores del enum v&#237;a</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="236.4629" x="275.45" y="411.917">@IsEnum(CoberturaEstado), y la pol&#237;tica</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="237.0342" x="275.45" y="428.2686">RLS cobertura_update solo exige el ROL</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="213.8462" x="275.45" y="444.6201">(unicom/transversal), sin comparar el</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="165.4961" x="275.45" y="460.9717">estado viejo contra el nuevo.</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="208.127" x="275.45" y="477.3232">Las flechas de este diagrama son el</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="189.3062" x="275.45" y="493.6748">camino que la interfaz SUGIERE</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="189.9854" x="275.45" y="510.0264">(COBERTURA_SIGUIENTES en</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="206.6289" x="275.45" y="526.3779">apps/web/src/lib/comunicacion.ts) --</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="190.8105" x="275.45" y="542.7295">no una regla de negocio exigible.</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="224.7388" x="275.45" y="559.0811">Es la diferencia m&#225;s notable entre este</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="225.4307" x="275.45" y="575.4326">m&#243;dulo (el m&#225;s nuevo del sistema) y el</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="216.7915" x="275.45" y="591.7842">resto: ver el hallazgo correspondiente</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="226.1606" x="275.45" y="608.1357">en 05-hallazgos-y-plan-de-mejoras.md.</text></g><!--link *start* to solicitada--><g id="link_*start*_solicitada"><path d="M615.45,116.7894 C615.45,160.3694 615.45,340.9594 615.45,407.9994 " fill="none" id="*start*-to-solicitada" style="stroke:#34495E;stroke-width:1;"/><polygon fill="#34495E" points="615.45,413.9994,619.45,404.9994,615.45,408.9994,611.45,404.9994,615.45,413.9994" style="stroke:#34495E;stroke-width:1;"/><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="122.1035" x="616.45" y="213.1045">POST /comunicacion</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="58.5571" x="648.2232" y="229.4561">{eventoId}</text></g><!--link solicitada to planificada--><g id="link_solicitada_planificada"><path d="M607.92,464.1294 C590.67,519.1594 550.2244,648.174 532.8744,703.534 " fill="none" id="solicitada-to-planificada" style="stroke:#34495E;stroke-width:1;"/><polygon fill="#34495E" points="531.08,709.2594,537.5885,701.8675,532.5753,704.4882,529.9546,699.475,531.08,709.2594" style="stroke:#34495E;stroke-width:1;"/><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="104.0254" x="552.45" y="660.1045">UNICOM planifica<