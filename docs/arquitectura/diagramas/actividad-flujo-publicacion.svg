ily="sans-serif" font-size="12" lengthAdjust="spacing" textLength="130.7285" x="615.0068" y="315.4199">(ve el motivo de rechazo</text><text fill="#000000" font-family="sans-serif" font-size="12" lengthAdjust="spacing" textLength="150.0938" x="615.0068" y="330.5137">en su tarjeta de publicaci&#243;n)</text><line style="stroke:#000000;stroke-width:1.5;" x1="312.1299" x2="312.1299" y1="51.0645" y2="816.2275"/><path d="M975.4287,482.2549 L975.4287,491.4307 L955.4287,495.4307 L975.4287,499.4307 L975.4287,508.6064 A0,0 0 0 0 975.4287,508.6064 L1237.5952,508.6064 A0,0 0 0 0 1237.5952,508.6064 L1237.5952,492.2549 L1227.5952,482.2549 L975.4287,482.2549 A0,0 0 0 0 975.4287,482.2549 " fill="#FEFFDD" style="stroke:#181818;stroke-width:0.5;"/><path d="M1227.5952,482.2549 L1227.5952,492.2549 L1237.5952,492.2549 L1227.5952,482.2549 " fill="#FEFFDD" style="stroke:#181818;stroke-width:0.5;"/><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="241.1665" x="981.4287" y="500.75">notifica al Secretario ("lista para publicar")</text><rect fill="#FEF9E7" height="50.1875" rx="12.5" ry="12.5" style="stroke:#7D6608;stroke-width:0.5;" width="170.3281" x="785.1006" y="470.3369"/><text fill="#000000" font-family="sans-serif" font-size="12" lengthAdjust="spacing" textLength="45.3691" x="795.1006" y="492.7939">Aprueba</text><text fill="#000000" font-family="sans-serif" font-size="12" lengthAdjust="spacing" textLength="150.3281" x="795.1006" y="507.8877">(PATCH estado='aprobado')</text><line style="stroke:#000000;stroke-width:1.5;" x1="779.1006" x2="779.1006" y1="51.0645" y2="816.2275"/><path d="M1439.5854,552.4424 L1439.5854,561.6182 L1419.5854,565.6182 L1439.5854,569.6182 L1439.5854,578.7939 A0,0 0 0 0 1439.5854,578.7939 L1594.2734,578.7939 A0,0 0 0 0 1594.2734,578.7939 L1594.2734,562.4424 L1584.2734,552.4424 L1439.5854,552.4424 A0,0 0 0 0 1439.5854,552.4424 " fill="#FEFFDD" style="stroke:#181818;stroke-width:0.5;"/><path d="M1584.2734,552.4424 L1584.2